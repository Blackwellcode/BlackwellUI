name: Bug Report / Lua Error
description: Report a bug, Lua error, visual glitch, or unintended behavior in BlackwellUI.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible so we can reproduce and fix the bug quickly.
  - type: input
    id: version
    attributes:
      label: BlackwellUI Version
      description: The version you are currently running (check `/bw` or your AddOn list).
      placeholder: "e.g. v2.6.7-azs"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Game Environment
      description: Where did this bug occur?
      options:
        - "Windows Client (AzerothSurvivors.exe)"
        - "Browser / WebAssembly (Benilla WASM WebGPU)"
        - "Mac / Linux Client"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: error_log
    attributes:
      label: Exact Lua Error / Stack Trace
      description: Copy and paste the full error text from the error popup, Swatter, BugSack, or `/err`.
      placeholder: "Interface\\AddOns\\BlackwellUI\\Core.lua:2069: attempt to call method 'Update' (a nil value)..."
      render: text
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we trigger or see this bug?
      placeholder: |
        1. Open BlackwellUI with `/bw`
        2. Move frames with `/bw unlock`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Media
      description: Drag and drop screenshots showing the bug or error message here.
    validations:
      required: false
